services:
  - type: web
    name: cleaniqqq
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://cleaniq-a1f4f.web.app,https://cleaniq-a1f4f.firebaseapp.com
